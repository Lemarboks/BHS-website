<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Bloubergrant High School 20 year anniversary background">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#5d3607"/>
      <stop offset=".42" stop-color="#130d05"/>
      <stop offset="1" stop-color="#010101"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff0a8"/>
      <stop offset=".2" stop-color="#f3b634"/>
      <stop offset=".48" stop-color="#ffdf73"/>
      <stop offset=".76" stop-color="#9b5d08"/>
      <stop offset="1" stop-color="#ffe7a0"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="sparkles" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="2" fill="#f8c24f" opacity=".75"/>
      <circle cx="74" cy="28" r="1.7" fill="#ffe28a" opacity=".65"/>
      <circle cx="42" cy="72" r="2.4" fill="#d89116" opacity=".55"/>
      <circle cx="22" cy="62" r="1.2" fill="#fff2b3" opacity=".7"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#sparkles)" opacity=".75"/>
  <rect x="24" y="24" width="1552" height="952" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="36" y="36" width="1528" height="928" fill="none" stroke="#b77912" stroke-width="1.5" opacity=".75"/>
  <path d="M0 165 C190 65 285 50 440 0" fill="none" stroke="url(#gold)" stroke-width="7" opacity=".9" filter="url(#soft-glow)"/>
  <path d="M-20 215 C185 120 310 112 480 18" fill="none" stroke="#ffd776" stroke-width="2.4" opacity=".85"/>
  <path d="M780 1000 C1030 855 1260 930 1600 820" fill="none" stroke="url(#gold)" stroke-width="9" opacity=".92" filter="url(#soft-glow)"/>
  <path d="M710 960 C960 845 1190 900 1580 748" fill="none" stroke="#ffd776" stroke-width="2.2" opacity=".86"/>
  <g fill="url(#gold)" text-anchor="middle" filter="url(#soft-glow)">
    <text x="800" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="8">BLOUBERGRANT HIGH SCHOOL</text>
    <text x="800" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="380" font-weight="700">20</text>
    <text x="800" y="760" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="16">ANNIVERSARY</text>
  </g>
  <g fill="#f7d77e" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" text-anchor="middle">
    <text x="520" y="510">ONLY</text>
    <text x="1220" y="510">YEAR</text>
  </g>
  <g transform="translate(135 390)" stroke="url(#gold)" stroke-width="5" fill="none" filter="url(#soft-glow)">
    <path d="M55 0 H230 V162 C180 220 105 250 55 250 C5 250 -70 220 -120 162 V0 Z" transform="translate(120 0)"/>
    <path d="M42 64 L132 154 M132 64 L42 154"/>
    <circle cx="86" cy="109" r="20"/>
    <path d="M40 235 Q120 275 200 235"/>
  </g>
  <g transform="translate(1200 660)" fill="url(#gold)" opacity=".9" filter="url(#soft-glow)">
    <circle cx="0" cy="75" r="58"/>
    <circle cx="120" cy="0" r="52"/>
    <circle cx="190" cy="100" r="68" fill="#15110d" stroke="#f4c762" stroke-width="4"/>
    <path d="M-80 80 C-10 20 48 8 95 -38 M20 155 C82 98 158 80 245 48" fill="none" stroke="#d99a22" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g fill="#fff2b3" opacity=".85" filter="url(#soft-glow)">
    <circle cx="250" cy="55" r="7"/>
    <circle cx="410" cy="86" r="5"/>
    <circle cx="950" cy="150" r="6"/>
    <circle cx="830" cy="560" r="7"/>
    <circle cx="880" cy="940" r="6"/>
    <circle cx="1380" cy="120" r="9"/>
  </g>
</svg>
